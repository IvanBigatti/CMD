      <div id="root" data-composition-id="c2" data-width="1920" data-height="1080">
        <div id="c2-bg"></div>
        <div id="c2-content">

      <script>
        (function () {
          const ID = "c2";
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#" + ID + "-content", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
          tl.to("#" + ID + "-content", { opacity: 0, duration: 0.35, ease: "power1.in" }, 2.6);

          window.__timelines[ID] = tl;
